function decompressGzip(d){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(d);w.close();return new Response(ds.readable).text();}

let map,geoJsonLayer,selectedBorough=null,boroughLabel=null;
const YEARS=S106.years;
const SHORT_YEARS=YEARS.map(y=>y.split('\u2013')[0].slice(-2)+'/'+y.split('\u2013')[1]);

// Heat colour scale: pivot at 0. Negative → green, zero → neutral grey, positive → red
const sMin=NEG.smooth_min, sMax=NEG.smooth_max;
function heatT(val){
  // Map val to 0..1 where 0 = most negative, 0.5 = zero, 1 = most positive
  if(val<=0){const negRange=Math.abs(sMin)||1;return 0.5-Math.min(Math.abs(val)/negRange,1)*0.5;}
  else{const posRange=sMax||1;return 0.5+Math.min(val/posRange,1)*0.5;}
}
function heatRGB(t){
  // t=0 → green (negative), t=0.5 → neutral grey, t=1 → red (positive)
  const r=Math.round(t<0.5?160*(t*2):160+(t-0.5)*2*80);
  const g=Math.round(t<0.5?160+(1-t*2)*80:160*(1-(t-0.5)*2));
  const b=Math.round(t<0.5?130*(t*2):130*(1-(t-0.5)*2));
  return [r,g,b];
}
function getHeatFill(val){const[r,g,b]=heatRGB(heatT(val));return `rgba(${r},${g},${b},0.25)`;}
function getHeatStroke(val){const[r,g,b]=heatRGB(heatT(val));return `rgba(${r},${g},${b},0.6)`;}
function getHeatColor(val){const[r,g,b]=heatRGB(heatT(val));return `rgb(${r},${g},${b})`;}

// Get the smoothed final value for a borough (for colour coding)
function getSmoothedFinal(name){return NEG.smoothed_finals[name]||0;}

// ── SVG chart for dated negotiation series ──
function buildNegotiationChart(series, opts={}) {
  const {w=430,h=155,padL=48,padR=15,padT=12,padB=32,color='var(--neg-color)'} = opts;
  const pts = series.smoothed || series;
  if(!pts||pts.length<2) return '<div class="no-data">Insufficient data</div>';
  const cw=w-padL-padR, ch=h-padT-padB;
  const allY=pts.map(p=>p.y);
  let yMin=Math.min(0,Math.min(...allY));
  let yMax=Math.max(...allY)*1.1;
  if(yMax<=yMin) yMax=yMin+100;
  const xScale=frac=>padL+frac*cw;
  const yScale=v=>padT+ch-((v-yMin)/(yMax-yMin))*ch;
  const fyTicks=[{frac:0,label:"Apr 19"},{frac:1/7,label:"Apr 20"},{frac:2/7,label:"Apr 21"},{frac:3/7,label:"Apr 22"},{frac:4/7,label:"Apr 23"},{frac:5/7,label:"Apr 24"},{frac:6/7,label:"Apr 25"},{frac:1,label:"Apr 26"}];
  let svg=`<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let i=0;i<=4;i++){const yVal=yMin+(yMax-yMin)*(i/4);const y=yScale(yVal);svg+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" class="chart-grid-line"/>`;svg+=`<text x="${padL-5}" y="${y+3}" text-anchor="end" class="chart-axis-label">${Math.round(yVal).toLocaleString()}</text>`;}
  if(yMin<0){const y0=yScale(0);svg+=`<line x1="${padL}" y1="${y0}" x2="${w-padR}" y2="${y0}" stroke="#999" stroke-width="0.5" stroke-dasharray="3,3"/>`;}
  fyTicks.forEach(t=>{if(t.frac>=0&&t.frac<=1)svg+=`<text x="${xScale(t.frac)}" y="${h-4}" text-anchor="middle" class="chart-axis-label">${t.label}</text>`;});
  const linePts=pts.map(p=>[xScale(p.x),yScale(p.y)]);
  const pathD=linePts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD=pathD+` L${linePts[linePts.length-1][0].toFixed(1)},${yScale(0).toFixed(1)} L${linePts[0][0].toFixed(1)},${yScale(0).toFixed(1)} Z`;
  svg+=`<path d="${areaD}" fill="${color}" class="chart-area"/>`;
  svg+=`<path d="${pathD}" stroke="${color}" class="chart-line"/>`;
  const last=linePts[linePts.length-1];
  svg+=`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/>`;
  const finalVal=pts[pts.length-1].y;
  svg+=`<text x="${last[0].toFixed(1)}" y="${last[1].toFixed(1)-8}" text-anchor="middle" style="font-size:10px;fill:var(--text-primary);font-weight:700;font-family:'Concourse T3','Concourse',Georgia,serif">${Math.round(finalVal).toLocaleString()}</text>`;
  svg+='</svg>';
  return svg;
}

function buildLineChart(opts){
  const{series,labels,w=420,h=140,padL=45,padR=15,padT=10,padB=28}=opts;
  const cw=w-padL-padR,ch=h-padT-padB;
  let allVals=[];series.forEach(s=>s.data.forEach(v=>{if(v!==null)allVals.push(v);}));
  if(allVals.length===0)return'<div class="no-data">No data available</div>';
  let yMin=Math.min(0,Math.min(...allVals));let yMax=Math.max(...allVals)*1.1;if(yMax<=yMin)yMax=yMin+1;
  const n=labels.length;const xScale=i=>padL+(i/(n-1))*cw;const yScale=v=>padT+ch-((v-yMin)/(yMax-yMin))*ch;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let i=0;i<=4;i++){const yVal=yMin+(yMax-yMin)*(i/4);const y=yScale(yVal);svg+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" class="chart-grid-line"/>`;svg+=`<text x="${padL-5}" y="${y+3}" text-anchor="end" class="chart-axis-label">${Math.round(yVal).toLocaleString()}</text>`;}
  labels.forEach((l,i)=>{svg+=`<text x="${xScale(i)}" y="${h-4}" text-anchor="middle" class="chart-axis-label">${l}</text>`;});
  series.forEach(s=>{const pts=s.data.map((v,i)=>v!==null?[xScale(i),yScale(v)]:null).filter(Boolean);if(pts.length===0)return;if(pts.length===1){svg+=`<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="3.5" fill="${s.color}"/>`;return;}const pathD=pts.map((p,i)=>(i===0?'M':'L')+p[0]+','+p[1]).join(' ');const areaD=pathD+` L${pts[pts.length-1][0]},${yScale(0)} L${pts[0][0]},${yScale(0)} Z`;svg+=`<path d="${areaD}" fill="${s.color}" class="chart-area"/>`;svg+=`<path d="${pathD}" stroke="${s.color}" class="chart-line"/>`;pts.forEach(p=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`;});});
  svg+='</svg>';return svg;
}

function buildGroupedBars(secured,starts,years){
  let html='<div class="bar-group">';const maxVal=Math.max(...secured.map(v=>v||0),...starts.map(v=>v||0),1);
  years.forEach((y,i)=>{const s=secured[i],st=starts[i];const sVal=(s!==null&&s!==undefined)?s:null;const stVal=(st!==null&&st!==undefined)?st:null;const shortY=SHORT_YEARS[i];
    html+=`<div style="margin-bottom:4px"><div style="font-size:11px;color:var(--text-secondary);font-weight:500;margin-bottom:3px">${shortY}</div>`;
    if(sVal!==null){const pct=Math.max((sVal/maxVal)*100,1);html+=`<div class="bar-row" style="margin-bottom:2px"><div style="width:55px;font-size:10px;color:var(--text-muted);text-align:right;flex-shrink:0">Secured</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--secured-color)"><span class="bar-val">${sVal>maxVal*0.12?sVal.toLocaleString():''}</span></div></div>${sVal<=maxVal*0.12?'<span class="bar-val-outside">'+sVal.toLocaleString()+'</span>':''}</div>`;}
    else html+=`<div class="bar-row"><div style="width:55px;font-size:10px;color:var(--text-muted);text-align:right;flex-shrink:0">Secured</div><div class="bar-na">No data</div></div>`;
    if(stVal!==null){const pct=Math.max((stVal/maxVal)*100,1);html+=`<div class="bar-row"><div style="width:55px;font-size:10px;color:var(--text-muted);text-align:right;flex-shrink:0">Starts</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--starts-color)"><span class="bar-val">${stVal>maxVal*0.12?stVal.toLocaleString():''}</span></div></div>${stVal<=maxVal*0.12?'<span class="bar-val-outside">'+stVal.toLocaleString()+'</span>':''}</div>`;}
    else html+=`<div class="bar-row"><div style="width:55px;font-size:10px;color:var(--text-muted);text-align:right;flex-shrink:0">Starts</div><div class="bar-na">No data</div></div>`;
    html+=`</div>`;});
  html+='</div>';return html;
}

function fmt(n){return n!==null&&n!==undefined?n.toLocaleString():'\u2014';}
function fmtCurrency(n){if(!n&&n!==0)return'\u2014';if(n>=1000000)return'\u00a3'+(n/1000000).toFixed(2)+'M';if(n>=1000)return'\u00a3'+(n/1000).toFixed(0)+'k';return'\u00a3'+n;}
function fmtPct(n){if(n===null||n===undefined)return'\u2014';return(n>=0?'+':'')+(n*100).toFixed(1)+'%';}

function populateOverview(){
  const boroughs=S106.boroughs;const names=Object.keys(boroughs);
  const totalSecured=S106.london_secured.reduce((s,v)=>s+v,0);
  const totalStarts=S106.london_starts.reduce((s,v)=>s+v,0);
  const netDiff=totalSecured-totalStarts;
  const londonCumulativeChart=buildLineChart({series:[{data:S106.london_cumulative_diff,color:'var(--neg-color)'}],labels:SHORT_YEARS});
  const londonLinesChart=buildLineChart({series:[{data:S106.london_secured,color:'var(--secured-color)'},{data:S106.london_starts,color:'var(--starts-color)'}],labels:SHORT_YEARS});

  // Rankings by smoothed under-negotiation value
  const byNeg=[...names].sort((a,b)=>getSmoothedFinal(b)-getSmoothedFinal(a));
  const maxNeg=Math.max(...names.map(n=>Math.abs(getSmoothedFinal(n))),1);
  const negRanking=byNeg.slice(0,12).map((b,i)=>{
    const v=getSmoothedFinal(b);const pct=(Math.abs(v)/maxNeg)*100;const col=getHeatColor(v);
    return `<div class="ranking-row"><div class="ranking-pos">${i+1}</div><div class="ranking-name" onclick="clickBoroughByName('${b.replace(/'/g,"\\'")}')">${b}</div><div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${pct}%;background:${col}"></div></div><div class="ranking-value">${Math.round(v).toLocaleString()}</div></div>`;
  }).join('');

  const bySecured=[...names].sort((a,b)=>boroughs[b].secured_total-boroughs[a].secured_total).slice(0,10);
  const maxSec=boroughs[bySecured[0]].secured_total||1;
  const secRanking=bySecured.map((b,i)=>{const v=boroughs[b].secured_total;const pct=(v/maxSec)*100;return `<div class="ranking-row"><div class="ranking-pos">${i+1}</div><div class="ranking-name" onclick="clickBoroughByName('${b.replace(/'/g,"\\'")}')">${b}</div><div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${pct}%;background:var(--red)"></div></div><div class="ranking-value">${fmt(v)}</div></div>`;}).join('');

  const byStarts=[...names].sort((a,b)=>boroughs[b].starts_total-boroughs[a].starts_total).slice(0,10);
  const maxSta=boroughs[byStarts[0]].starts_total||1;
  const staRanking=byStarts.map((b,i)=>{const v=boroughs[b].starts_total;const pct=(v/maxSta)*100;return `<div class="ranking-row"><div class="ranking-pos">${i+1}</div><div class="ranking-name" onclick="clickBoroughByName('${b.replace(/'/g,"\\'")}')">${b}</div><div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${pct}%;background:var(--green)"></div></div><div class="ranking-value">${fmt(v)}</div></div>`;}).join('');

  const byCumDiff=[...names].sort((a,b)=>boroughs[b].difference-boroughs[a].difference);
  const maxCumAbs=Math.max(...names.map(n=>Math.abs(boroughs[n].difference)),1);
  const cumDiffRanking=byCumDiff.slice(0,10).map((b,i)=>{const v=boroughs[b].difference;const pct=(Math.abs(v)/maxCumAbs)*100;const col=v>=0?getHeatColor(v):'var(--red)';return `<div class="ranking-row"><div class="ranking-pos">${i+1}</div><div class="ranking-name" onclick="clickBoroughByName('${b.replace(/'/g,"\\'")}')">${b}</div><div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${pct}%;background:${col}"></div></div><div class="ranking-value">${fmt(v)}</div></div>`;}).join('');

  document.getElementById('overview-content').innerHTML=`
    <div class="panel-header"><h2>Greater London</h2><div class="subtitle">Section 106 Overview &mdash; 2019/20 to 2024/25</div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Units Secured</div><div class="stat-value">${fmt(totalSecured)}</div></div>
      <div class="stat-card"><div class="stat-label">Units Started</div><div class="stat-value">${fmt(totalStarts)}</div></div>
      <div class="stat-card"><div class="stat-label">Net Difference</div><div class="stat-value stat-negative">${fmt(netDiff)}</div></div>
    </div>
    <div class="data-note"><strong>Note:</strong> The total units secured figure is likely to be higher than reported. Data covering at least 26 financial years across several boroughs was unavailable at the time of collection, meaning some S106 agreements will not be reflected in these figures.</div>
    <div class="section-title">Cumulative Secured \u2013 Starts Difference</div>
    <div class="chart-card">
      <h3>Cumulative units secured but not yet started on site</h3>
      <div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--neg-color)"></div>Cumulative difference</div></div>
      ${londonCumulativeChart}
    </div>
    <div class="section-title">Annual Secured vs. Starts</div>
    <div class="chart-card">
      <h3>S106 units per fiscal year across London</h3>
      <div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--secured-color)"></div>Secured</div><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--starts-color)"></div>Starts</div></div>
      ${londonLinesChart}
    </div>
    <div class="section-title">Boroughs by Total S106 Secured</div>
    <div class="chart-card"><h3>Top 10 boroughs</h3><div class="ranking-list">${secRanking}</div></div>
    <div class="section-title">Boroughs by Total S106 Started</div>
    <div class="chart-card"><h3>Top 10 boroughs</h3><div class="ranking-list">${staRanking}</div></div>
    <div class="section-title">Boroughs by Cumulative Difference</div>
    <div class="chart-card"><h3>Top 10 boroughs</h3><div class="ranking-list">${cumDiffRanking}</div></div>
  `;
}

function populatePanel(name){
  const d=S106.boroughs[name];
  if(!d){document.getElementById('panel-content').innerHTML='<div class="no-data">No S106 data available.</div>';return;}
  const isGreenwich=name==='Greenwich';
  const netDiff=d.difference;
  const linesChart=buildLineChart({series:[{data:d.secured,color:'var(--secured-color)'},{data:d.starts,color:'var(--starts-color)'}],labels:SHORT_YEARS});
  // Compute cumulative difference for the borough
  let boroughCumDiff=[];let cumSum=0;
  for(let i=0;i<YEARS.length;i++){
    const sec=(d.secured[i]!==null&&d.secured[i]!==undefined)?d.secured[i]:0;
    const sta=(d.starts[i]!==null&&d.starts[i]!==undefined)?d.starts[i]:0;
    cumSum+=sec-sta;boroughCumDiff.push(cumSum);
  }
  const boroughCumChart=buildLineChart({series:[{data:boroughCumDiff,color:'var(--neg-color)'}],labels:SHORT_YEARS});
  const groupedBars=buildGroupedBars(d.secured,d.starts,YEARS);

  let greenwichSection='';
  if(isGreenwich){
    const sums=S106.greenwich_sums;const pcts=S106.greenwich_pct;
    const totalSums=sums.reduce((s,v)=>s+(v||0),0);
    const sumsChart=buildLineChart({series:[{data:sums.map(v=>v!==null?v/1000000:null),color:'var(--blue)'}],labels:SHORT_YEARS,h:130});
    const pctBars=YEARS.map((y,i)=>{const p=pcts[i];if(p===null||p===undefined)return `<div class="bar-row"><div class="bar-year">${SHORT_YEARS[i]}</div><div class="bar-na">N/A</div></div>`;const isPos=p>=0;const barW=Math.max(Math.min(Math.abs(p)*100,100)/2.5,2);const col=isPos?'var(--green)':'var(--red)';return `<div class="bar-row"><div class="bar-year">${SHORT_YEARS[i]}</div><div class="bar-track"><div class="bar-fill" style="width:${barW}%;background:${col}"></div></div><span class="bar-val-outside">${fmtPct(p)}</span></div>`;}).join('');
    greenwichSection=`
    <div class="animate-in delay-5">
      <div class="section-title" style="border-bottom-color:var(--blue)">Greenwich Case Study &mdash; Commuted Sums</div>
      <div class="chart-card"><h3>S106 commuted sums received (&pound;M)</h3><div style="margin-bottom:8px;font-size:12px;color:var(--text-secondary)">Total received: <strong style="color:var(--text-primary)">${fmtCurrency(totalSums)}</strong></div>${sumsChart}</div>
      <div class="chart-card"><h3>Year-on-year % change in commuted sums</h3><div class="bar-group">${pctBars}</div></div>
      <div class="chart-card"><h3>Why Greenwich?</h3><p style="font-size:12px;color:var(--text-secondary);line-height:1.6">Greenwich has the largest gap between S106 units secured and starts across all London boroughs, with <strong style="color:var(--red)">${fmt(Math.abs(d.difference))}</strong> more units secured than started. Since the fiscal year 19/20, the Royal Borough of Greenwich has received over <strong style="color:var(--text-primary)">${fmtCurrency(totalSums)}</strong> in commuted sums. This indicates that Section 106 units are not just unbuilt because of the inherent delays caused by the friction of the Section 106 system, but also the ability of developers to buy themselves out of their obligations, which they do frequently owing to the unattractiveness of affordable housing delivery.</p></div>
    </div>`;
  }

  document.getElementById('panel-content').innerHTML=`
    <div class="panel-header animate-in delay-1"><h2 style="display:flex;align-items:center;gap:10px">${name}${isGreenwich?'<span class="case-study-badge" style="font-size:0.4em">&#9670; Case Study</span>':''}</h2><div class="subtitle">S106 Data &mdash; 2019/20 to 2024/25</div></div>
    <div class="stats-grid animate-in delay-2">
      <div class="stat-card"><div class="stat-label">Units Secured</div><div class="stat-value">${fmt(d.secured_total)}</div></div>
      <div class="stat-card"><div class="stat-label">Units Started</div><div class="stat-value">${fmt(d.starts_total)}</div></div>
      <div class="stat-card"><div class="stat-label">Net Difference</div><div class="stat-value ${netDiff>0?'stat-negative':'stat-positive'}">${fmt(netDiff)}</div></div>
    </div>
    <div class="animate-in delay-3">
      <div class="section-title">Cumulative Secured \u2013 Starts Difference</div>
      <div class="chart-card"><h3>Cumulative units secured but not yet started on site</h3>
        <div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--neg-color)"></div>Cumulative difference</div></div>
        ${boroughCumChart}
      </div>
    </div>
    <div class="animate-in delay-3">
      <div class="section-title">Annual Secured vs. Starts</div>
      <div class="chart-card"><h3>S106 units per fiscal year</h3>
        <div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--secured-color)"></div>Secured</div><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--starts-color)"></div>Starts</div></div>
        ${linesChart}
      </div>
    </div>
    <div class="animate-in delay-3">
      <div class="section-title">Secured &amp; Starts by Year</div>
      <div class="chart-card"><h3>Yearly breakdown</h3>
        <div class="chart-legend" style="margin-bottom:14px"><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--secured-color)"></div>Secured</div><div class="chart-legend-item"><div class="chart-legend-line" style="background:var(--starts-color)"></div>Starts</div></div>
        ${groupedBars}
      </div>
    </div>
    ${greenwichSection}
  `;
}

async function init(){
  map=L.map('map',{center:[51.505,-0.09],zoom:9.5,zoomControl:false,attributionControl:true,zoomSnap:0.25,zoomDelta:0.5,maxZoom:14,minZoom:9,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,touchZoom:false,boxZoom:false,keyboard:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',subdomains:'abcd',maxZoom:19}).addTo(map);
  const compressed=b64ToUint8(B64_DATA);const jsonStr=await decompressGzip(compressed);const geojsonData=JSON.parse(jsonStr);
  geoJsonLayer=L.geoJSON(geojsonData,{style:heatStyle,onEachFeature:onEachFeature}).addTo(map);
  map.fitBounds(geoJsonLayer.getBounds().pad(0.15));
  populateOverview();
}

function heatStyle(feature){
  const name=feature.properties.name;const val=getSmoothedFinal(name);
  return{fillColor:getHeatFill(val),weight:1,opacity:0.5,color:getHeatStroke(val),fillOpacity:1};
}
function highlightStyle(feature){
  const name=feature.properties.name;const val=getSmoothedFinal(name);const col=getHeatColor(val);
  return{fillColor:getHeatFill(val).replace('0.22','0.38'),weight:2,opacity:0.9,color:col,fillOpacity:1};
}
function activeStyle(feature){
  const name=feature.properties.name;const val=getSmoothedFinal(name);const col=getHeatColor(val);
  return{fillColor:getHeatFill(val).replace('0.22','0.45'),weight:2.5,opacity:1,color:col,fillOpacity:1};
}
function dimmedStyle(){return{fillColor:'rgba(200,200,200,0.06)',weight:0.5,opacity:0.12,color:'rgba(13,17,23,0.05)',fillOpacity:1};}

function onEachFeature(feature,layer){
  const name=feature.properties.name;const val=getSmoothedFinal(name);
  const diff=S106.boroughs[name]?S106.boroughs[name].difference:null;
  layer.bindTooltip(`${name}<br><span style="font-size:11px;color:var(--text-muted)">Net difference: ${diff!==null?diff.toLocaleString():'\u2014'}</span>`,{sticky:true,className:'map-tooltip',direction:'top',offset:[0,-10]});
  layer.on({
    mouseover:function(e){if(selectedBorough&&selectedBorough!==name)return;if(!selectedBorough){e.target.setStyle(highlightStyle(feature));e.target.bringToFront();}},
    mouseout:function(e){if(selectedBorough&&selectedBorough!==name)return;if(!selectedBorough)e.target.setStyle(heatStyle(feature));},
    click:function(){selectBorough(name,layer);}
  });
}
function clickBoroughByName(name){geoJsonLayer.eachLayer(function(l){if(l.feature.properties.name===name)selectBorough(name,l);});}
function selectBorough(name,layer){
  if(selectedBorough===name)return;selectedBorough=name;
  geoJsonLayer.eachLayer(function(l){if(l.feature.properties.name===name){l.setStyle(activeStyle(l.feature));l.bringToFront();}else l.setStyle(dimmedStyle());l.closeTooltip();});
  map.fitBounds(layer.getBounds(),{padding:[60,60],maxZoom:13,animate:true,duration:0.8});
  if(boroughLabel)map.removeLayer(boroughLabel);
  // Compute polygon centroid (geographic centre of mass, not bounding box centre)
  const centroid=(function(feat){
    let coords=[];
    const geom=feat.geometry;
    if(geom.type==='Polygon')coords=geom.coordinates[0];
    else if(geom.type==='MultiPolygon'){let biggest=0,idx=0;geom.coordinates.forEach((p,i)=>{if(p[0].length>biggest){biggest=p[0].length;idx=i;}});coords=geom.coordinates[idx][0];}
    if(coords.length===0)return layer.getBounds().getCenter();
    let area=0,cx=0,cy=0;
    for(let i=0;i<coords.length-1;i++){
      const x0=coords[i][0],y0=coords[i][1],x1=coords[i+1][0],y1=coords[i+1][1];
      const a=x0*y1-x1*y0;area+=a;cx+=(x0+x1)*a;cy+=(y0+y1)*a;
    }
    area/=2;if(Math.abs(area)<1e-10)return layer.getBounds().getCenter();
    cx/=(6*area);cy/=(6*area);
    return L.latLng(cy,cx);
  })(layer.feature);
  boroughLabel=L.marker(centroid,{icon:L.divIcon({className:'borough-label',html:name,iconSize:null})}).addTo(map);
  setTimeout(()=>{document.querySelectorAll('.borough-label').forEach(el=>el.classList.add('visible'));},400);
  document.getElementById('header-overlay').style.opacity='0';
  document.getElementById('back-btn').classList.add('visible');
  document.getElementById('overview-panel').classList.add('hidden');
  document.getElementById('side-panel').classList.add('open');
  populatePanel(name);
}
function resetView(){
  selectedBorough=null;geoJsonLayer.eachLayer(function(l){l.setStyle(heatStyle(l.feature));});
  if(boroughLabel){map.removeLayer(boroughLabel);boroughLabel=null;}
  map.fitBounds(geoJsonLayer.getBounds().pad(0.15),{animate:true,duration:0.8});
  document.getElementById('header-overlay').style.opacity='1';document.getElementById('back-btn').classList.remove('visible');
  document.getElementById('side-panel').classList.remove('open');document.getElementById('overview-panel').classList.remove('hidden');
}
init();
</script>
